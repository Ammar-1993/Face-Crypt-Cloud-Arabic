[pytest]
# Restrict collection to the real test suite only. Without this, pytest's
# default recursive discovery can pick up any repo-root file matching
# test_*.py — including one-off debug scripts (e.g. test_firestore.py)
# that connect to LIVE Firestore with no mocking and have no actual test
# functions inside them. Scoping testpaths removes that ambiguity entirely,
# regardless of pytest version defaults.
testpaths = tests
